version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 5000:5000
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: ${COPYSTART_DB_CONNECTION:?Set COPYSTART_DB_CONNECTION in Application/.env}

  postgres:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      DATABASE_HOST: 127.0.0.1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${COPYSTART_DB_PASSWORD:?Set COPYSTART_DB_PASSWORD in Application/.env}
      POSTGRES_DB: CopyStartDB
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
